[project]
name = "spotter-model"
version = "0.1.0"
description = "The EuroSAT classifier architecture and preprocessing, shared by training and serving"
requires-python = ">=3.13"
dependencies = ["torch>=2.9", "numpy>=2.1", "pillow>=11"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotter_model"]
