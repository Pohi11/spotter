# Python code generated from proto/ by `buf generate`. Do not edit the generated files.
[project]
name = "spotter-proto"
version = "0.1.0"
description = "Generated protobuf messages for Spotter"
requires-python = ">=3.13"
# The generated code checks the runtime version; it must be at least the generator's version.
dependencies = ["protobuf>=7.36.2,<8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotter"]
