name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NATS_IMAGE: nats:2.15.3-alpine

jobs:
  proto:
    name: Protobuf contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen/ || { echo "::error::Generated code is stale. Run 'buf generate' and commit."; exit 1; }
          test -z "$(git status --porcelain -- gen/)" || { echo "::error::buf generate created uncommitted files."; git status --porcelain -- gen/; exit 1; }
      - name: No breaking changes against main
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      # Postgres tests start their own container with testcontainers (decision record 0005).
      - name: Test (race detector)
        run: go run gotest.tools/gotestsum@v1.13.0 --format testname --jsonfile go-test.json -- -race -count=1 ./...
      - name: Every requirement has a passing test
        if: ${{ !cancelled() }}
        run: go run ./tools/speccheck -openspec openspec -go go-test.json
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-report
          path: go-test.json

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Start NATS
        run: docker run -d --name nats -p 4222:4222 "$NATS_IMAGE" --jetstream
      - name: Test
        env:
          NATS_URL: nats://localhost:4222
        run: uv run pytest -q

  end-to-end:
    name: Go to Python over NATS
    needs: [go, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - name: Start NATS
        run: docker run -d --name nats -p 4222:4222 "$NATS_IMAGE" --jetstream
      - name: Ping the Python worker from the Go CLI
        env:
          NATS_URL: nats://localhost:4222
        run: |
          go build -o spotterctl ./cmd/spotterctl
          uv run spotter-inference > worker.log 2>&1 &
          for _ in $(seq 1 40); do ./spotterctl ping && ok=1 && break; sleep 0.5; done
          cat worker.log
          test "${ok:-}" = 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history every time. (gitleaks-action scans "first commit^..head"
      # on a push, which fails when the first commit is the repository's root.)
      - name: Scan the full git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
