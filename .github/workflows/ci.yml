name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NATS_IMAGE: nats:2.15.3-alpine

jobs:
  proto:
    name: Protobuf contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen/ || { echo "::error::Generated code is stale. Run 'buf generate' and commit."; exit 1; }
          test -z "$(git status --porcelain -- gen/)" || { echo "::error::buf generate created uncommitted files."; git status --porcelain -- gen/; exit 1; }
      - name: No breaking changes against main
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/main"

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      # Postgres tests start their own container with testcontainers (decision record 0005).
      - name: Test (race detector)
        run: go run gotest.tools/gotestsum@v1.13.0 --format testname --jsonfile go-test.json -- -race -count=1 ./...
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-report
          path: go-test.json

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start NATS and SeaweedFS, create streams from their Go definition
        run: |
          cp .env.example .env
          docker compose up -d --wait nats seaweedfs
          set -a; . ./.env; set +a
          go run ./cmd/spotterctl setup
      - name: Test
        run: |
          set -a; . ./.env; set +a
          uv run pytest -q --junitxml=python-test.xml
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: python-test-report
          path: python-test.xml

  spec-coverage:
    name: Every requirement has a passing test
    needs: [go, python, kubernetes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v7
        with:
          pattern: "*-test-report"
          merge-multiple: true
      - name: Check spec coverage across Go, Kubernetes, and Python
        run: go run ./tools/speccheck -openspec openspec -go go-test.json,go-kube-test.json -junit python-test.xml

  end-to-end:
    name: Go to Python over NATS
    needs: [go, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - name: Start NATS
        run: docker run -d --name nats -p 4222:4222 "$NATS_IMAGE" --jetstream
      - name: Ping the Python worker from the Go CLI
        env:
          NATS_URL: nats://localhost:4222
        run: |
          go build -o spotterctl ./cmd/spotterctl
          uv run spotter-inference > worker.log 2>&1 &
          for _ in $(seq 1 40); do ./spotterctl ping && ok=1 && break; sleep 0.5; done
          cat worker.log
          test "${ok:-}" = 1

  kubernetes:
    name: Helm chart on kind
    needs: [go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: spotter
      - name: Build images
        run: |
          docker build -f deploy/docker/go.Dockerfile -t spotter-go:dev .
          docker build -f deploy/docker/python.Dockerfile -t spotter-python:dev .
      - name: Load images into kind
        run: kind load docker-image spotter-go:dev spotter-python:dev --name spotter
      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm install keda kedacore/keda --version 2.21.1 -n keda --create-namespace --wait --timeout 5m
      - name: Install Spotter into the empty namespace
        run: helm install spotter deploy/helm/spotter -n spotter --create-namespace -f deploy/helm/values-ci.yaml --wait --timeout 10m
      - name: Smoke test and upgrade (helm test, credentials kept)
        env:
          SPOTTER_KUBE_CONTEXT: kind-spotter
        run: go run gotest.tools/gotestsum@v1.13.0 --format testname --jsonfile go-kube-test.json -- -count=1 -run 'TestFreshInstall|TestUpgradeKeepsCredentials' ./deploy/helm
      - name: Show cluster state on failure
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide
          kubectl -n spotter describe pods
          kubectl -n spotter logs -l app.kubernetes.io/part-of=spotter --all-containers --tail=100
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kube-test-report
          path: go-kube-test.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history every time. (gitleaks-action scans "first commit^..head"
      # on a push, which fails when the first commit is the repository's root.)
      - name: Scan the full git history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
