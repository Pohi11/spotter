apiVersion: v2
name: spotter
description: Spotter, a cloud-neutral platform for deploying and monitoring computer-vision models (decision record 0014).
type: application
version: 0.1.0
appVersion: "0.9.0"
dependencies:
  # Vendored under charts/ (helm dependency update) so installs work without the network.
  - name: nats
    version: 2.15.3
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
