{{- /* Single-instance Postgres for development and CI (decision record 0014). */ -}}
{{- if .Values.postgres.enabled }}
{{- $c := dict "root" . "component" "postgres" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "spotter.name" $c }}
  labels:
    {{- include "spotter.labels" $c | nindent 4 }}
spec:
  serviceName: {{ include "spotter.name" $c }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "spotter.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spotter.labels" $c | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: {{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "spotter.secretName" . }}
                  key: postgres-password
          ports:
            - { name: postgres, containerPort: 5432 }
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # Postgres 18+ keeps data under /var/lib/postgresql/<major>/.
            - { name: data, mountPath: /var/lib/postgresql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spotter.name" $c }}
  labels:
    {{- include "spotter.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "spotter.selector" $c | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
