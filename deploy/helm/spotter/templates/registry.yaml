{{- $c := dict "root" . "component" "registry" }}
{{- $waitFor := list (printf "%s:4222" (include "spotter.natsHost" .)) }}
{{- if .Values.postgres.enabled }}{{ $waitFor = append $waitFor (printf "%s:5432" (include "spotter.postgresHost" .)) }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spotter.name" $c }}
  labels:
    {{- include "spotter.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.registry.replicas }}
  selector:
    matchLabels:
      {{- include "spotter.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spotter.labels" $c | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ include "spotter.terminationGrace" . }}
      securityContext:
        {{- include "spotter.restrictedPod" . | nindent 8 }}
      initContainers:
        {{- include "spotter.waitFor" (dict "root" . "addrs" $waitFor) | nindent 8 }}
      containers:
        - name: registry
          image: {{ include "spotter.goImage" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["registry"]
          env:
            {{- include "spotter.goServiceEnv" . | nindent 12 }}
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.enabled }}
                  name: {{ include "spotter.secretName" . }}
                  key: database-url
                  {{- else }}
                  name: {{ required "externalDatabase.existingSecret is required when postgres.enabled is false" .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.key }}
                  {{- end }}
            {{- include "spotter.otelEnv" (dict "root" . "service" "registry") | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
          {{- include "spotter.goProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
          securityContext:
            {{- include "spotter.restrictedContainer" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spotter.name" $c }}
  labels:
    {{- include "spotter.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "spotter.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 9090, targetPort: grpc }
