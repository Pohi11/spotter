{{- /*
Credentials (decision record 0014): generated at first install, kept on upgrade by reading the
existing Secret back with lookup. Skipped when auth.existingSecret names a Secret to use instead.
*/ -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "spotter.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pgPassword := get $old "postgres-password" | default (randAlphaNum 32 | b64enc) }}
{{- $url := printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.user (b64dec $pgPassword) (include "spotter.postgresHost" .) .Values.postgres.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "spotter.labels" (dict "root" . "component" "credentials") | nindent 4 }}
  annotations:
    # Uninstalling the release must not orphan data whose password only this Secret knows.
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $pgPassword }}
  database-url: {{ get $old "database-url" | default ($url | b64enc) }}
  s3-access-key: {{ get $old "s3-access-key" | default (randAlphaNum 20 | b64enc) }}
  s3-secret-key: {{ get $old "s3-secret-key" | default (randAlphaNum 40 | b64enc) }}
{{- end }}
