# Scrapes Spotter's services running on the host during local development (decision record 0004).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: registry
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: inference-worker
    static_configs:
      - targets: ["host.docker.internal:9464"]
